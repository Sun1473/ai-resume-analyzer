# Run with: mvn spring-boot:run -Dspring-boot.run.profiles=h2
server.port=8080

spring.datasource.url=jdbc:h2:mem:resumedb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

jwt.secret=change-this-to-a-long-random-secret-key-min-32-chars
jwt.expiration-ms=86400000

anthropic.api.key=${ANTHROPIC_API_KEY:your-api-key-here}
anthropic.api.url=https://api.anthropic.com/v1/messages
anthropic.api.model=claude-sonnet-5
