# ===== Server =====
server.port=8080

# ===== MySQL Database =====
spring.datasource.url=jdbc:mysql://localhost:3306/resume_analyzer_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=your_mysql_password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ===== JWT =====
# IMPORTANT: change this secret before deploying anywhere public.
# Must be at least 32 characters for HS256.
jwt.secret=change-this-to-a-long-random-secret-key-min-32-chars
jwt.expiration-ms=86400000

# ===== Anthropic (Claude) API =====
# Get your key from https://console.anthropic.com — NEVER commit a real key to GitHub.
# Set it as an environment variable instead: export ANTHROPIC_API_KEY=sk-ant-xxxx
anthropic.api.key=${ANTHROPIC_API_KEY:your-api-key-here}
anthropic.api.url=https://api.anthropic.com/v1/messages
anthropic.api.model=claude-sonnet-5

# ===== Logging =====
logging.level.com.ara.resumeanalyzer=DEBUG
